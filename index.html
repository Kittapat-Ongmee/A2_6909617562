<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Learning Portfolio</title>

    <link rel="stylesheet" href="css/style.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <header class="container-fluid py-4 shadow-sm bg-body rounded">
      <div class="container">
        <h1 class="fw-bold mb-0">
          My Learning <span class="text-primary">Portfolio</span>
        </h1>
      </div>
    </header>
    <main>
      <!-- About Me -->
      <section class="container py-5">
        <div class="row g-4 align-items-stretch">
          <div class="col-12 col-md-5">
            <div class="about-profile h-80 p-4 p-lg-5 rounded-4">
              <h2 class="fw-bold mb-3">
                About <span class="text-primary">Me</span>
              </h2>

              <h3 class="h4 fw-bold mb-2">นายกฤตภาส อ่องมี</h3>

              <p class="text-secondary mb-4">Computer Science Student</p>
            </div>
          </div>

          <!-- Personal Information -->
          <div class="col-12 col-md-7">
            <div class="about-details h-100 p-4 p-lg-5 rounded-4">
              <h3 class="h5 fw-bold mb-4">Personal Information</h3>

              <div class="info-item">
                <span class="info-label">Student ID</span>
                <p class="info-value">6909617562</p>
              </div>

              <div class="info-item">
                <span class="info-label">Program</span>
                <p class="info-value">วิทยาการคอมพิวเตอร์</p>
              </div>

              <div class="info-item">
                <span class="info-label">Interests</span>
                <p class="info-value">Gaming, Music, Coding</p>
              </div>

              <!-- Yorushika Band -->
              <div class="info-item">
                <span class="info-label">My Favourite Band</span>

                <div class="band-card mt-3">
                  <img
                    src="media/yorushika.jpg"
                    alt="Yorushika band"
                    class="band-image"
                  />

                  <div class="band-info">
                    <h4 class="h6 fw-bold mb-1">Yorushika</h4>
                    <p class="text-secondary small mb-2">ヨルシカ</p>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
